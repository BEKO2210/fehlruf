name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo → Settings → Secrets and variables → Actions → Variables
      # (als Secret gespeichert geht auch)
      VITE_API_URL: ${{ vars.FEHLRUF_API_URL || secrets.FEHLRUF_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: API-Adresse prüfen
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::FEHLRUF_API_URL fehlt. Settings → Secrets and variables → Actions → Reiter Variables → New repository variable (nicht unter Environments)."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::FEHLRUF_API_URL muss mit https:// beginnen"; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
